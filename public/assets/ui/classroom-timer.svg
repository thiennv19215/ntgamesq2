<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="wood" x1="18" y1="15" x2="103" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe39a"/>
      <stop offset=".28" stop-color="#bd792e"/>
      <stop offset=".53" stop-color="#fff0b2"/>
      <stop offset=".77" stop-color="#8c4a20"/>
      <stop offset="1" stop-color="#e5ad54"/>
