  <circle cx="60" cy="60" r="49" fill="url(#wood)" stroke="#ffe5a0" stroke-width="2"/>
  <circle cx="60" cy="60" r="43.5" fill="#714522" stroke="#4c2c19" stroke-width="2"/>
  <circle cx="60" cy="60" r="39.5" fill="url(#face)" stroke="#f4d27c" stroke-width="2"/>
  <circle cx="60" cy="60" r="38" fill="url(#shine)"/>
